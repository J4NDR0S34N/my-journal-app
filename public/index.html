<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>My Journal</title>
  <meta name="description" content="Diario personal." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0b0a" />
  <meta name="color-scheme" content="dark light" />
  <script>
    // Aplica tema, movimiento y luz del día antes de pintar (evita un
    // destello). Misma lógica que js/lib/prefs.js y js/lib/luz.js.
    try { document.documentElement.dataset.theme = localStorage.getItem("mj:theme") || "dark"; } catch (e) {}
    try {
      var m = localStorage.getItem("mj:motion");
      document.documentElement.dataset.motion = /^(full|soft|still)$/.test(m || "") ? m
        : matchMedia("(prefers-reduced-motion: reduce)").matches ? "still" : "full";
    } catch (e) {}
    (function (h) { document.documentElement.dataset.luz = h >= 5 && h < 8 ? "alba" : h >= 8 && h < 17 ? "dia" : h >= 17 && h < 20 ? "tarde" : "noche"; })(new Date().getHours());
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Journal" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Gelasio:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Special+Elite&family=Teko:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Precarga en paralelo: sin esto cada archivo espera al anterior (app → store → config → Firebase). -->
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/config.js" />
  <link rel="modulepreload" href="js/habits.js" />
  <link rel="modulepreload" href="js/lib/dates.js" />
  <link rel="modulepreload" href="js/lib/ui.js" />
  <link rel="modulepreload" href="js/lib/activity.js" />
  <link rel="modulepreload" href="js/lib/collections.js" />
  <link rel="modulepreload" href="js/lib/luz.js" />
  <link rel="modulepreload" href="js/lib/prefs.js" />
  <link rel="modulepreload" href="js/lib/presence.js" />
  <link rel="modulepreload" href="js/lib/umbral.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js" />
  <script type="module" src="js/app.js"></script>
</head>
<body data-route="inicio">

    <button id="nav-toggle" class="nav-toggle" aria-controls="nav" aria-expanded="false">
      <span class="nav-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="nav-word">Menú</span>
    </button>
    <span class="nav-current" id="nav-current"></span>
  </header>
  <nav id="nav" class="nav" aria-label="Secciones"></nav>
  <main id="view"></main>
  <div id="gate" class="gate" hidden></div>
</body>
</html>
