  <meta name="theme-color" content="#0c0b0a" />
  <meta name="color-scheme" content="dark light" />
  <script>
    // Aplica tema, movimiento y luz del día antes de pintar (evita un
    // destello). Misma lógica que js/lib/prefs.js y js/lib/luz.js.
    try {
      var t = localStorage.getItem("mj:theme") || "dark", hr = new Date().getHours();
      if (t === "auto" || t === "system" || t === "hour") t = hr >= 8 && hr < 20 ? "light" : "dark";
      document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    } catch (e) {}
    try {
      var m = localStorage.getItem("mj:motion");
      document.documentElement.dataset.motion = /^(full|still)$/.test(m || "") ? m
        : matchMedia("(prefers-reduced-motion: reduce)").matches ? "still" : "full";
    } catch (e) {}
    (function (h) { document.documentElement.dataset.luz = h >= 5 && h < 8 ? "alba" : h >= 8 && h < 17 ? "dia" : h >= 17 && h < 20 ? "tarde" : "noche"; })(new Date().getHours());
  </script>
